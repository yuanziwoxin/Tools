<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" role="img" aria-label="方案 A：统一调整字体样式面板原型">
<rect x="0" y="0" width="900" height="500" fill="#ffffff"/>
<g font-family="-apple-system, Segoe UI, Microsoft YaHei, sans-serif">
<text x="32" y="40" font-size="22" font-weight="700" fill="#0f172a">方案 A · 只做「统一调整」</text>
<text x="32" y="66" font-size="13" fill="#475569">样式挂在「整个对象」上，数据层仍是纯字符串，没有选区、没有片段</text>

<rect x="32" y="88" width="332" height="340" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="52" y="118" font-size="15" font-weight="700" fill="#0f172a">文字样式</text>

<rect x="52" y="134" width="88" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="144" y="134" width="88" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="236" y="134" width="108" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="96" y="153" font-size="12" text-anchor="middle" fill="#475569">全局</text>
<text x="188" y="153" font-size="12" text-anchor="middle" fill="#475569">按类型</text>
<text x="290" y="153" font-size="12" text-anchor="middle" font-weight="700" fill="#1d4ed8">当前对象</text>

<text x="52" y="192" font-size="12.5" fill="#64748b">作用对象</text>
<rect x="52" y="202" width="292" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="64" y="222" font-size="12.5" fill="#0f172a">节点文字 · 节点「项目里程碑计划」</text>

<text x="52" y="258" font-size="12.5" fill="#64748b">字号</text>
<rect x="52" y="268" width="34" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="90" y="268" width="120" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="214" y="268" width="34" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="69" y="288" font-size="14" text-anchor="middle" fill="#0f172a">−</text>
<text x="150" y="288" font-size="12.5" text-anchor="middle" fill="#0f172a">16 px</text>
<text x="231" y="288" font-size="14" text-anchor="middle" fill="#0f172a">+</text>

<text x="52" y="324" font-size="12.5" fill="#64748b">字重 / 字形</text>
<rect x="52" y="334" width="142" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="202" y="334" width="142" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
<text x="64" y="354" font-size="12.5" fill="#0f172a">加粗　▾</text>
<text x="214" y="354" font-size="12.5" fill="#0f172a">常规　▾</text>

<text x="52" y="390" font-size="12.5" fill="#64748b">字色</text>
<circle cx="66" cy="406" r="9" fill="#0f172a"/>
<circle cx="92" cy="406" r="9" fill="#2563eb"/>
<circle cx="118" cy="406" r="9" fill="#dc2626" stroke="#1d4ed8" stroke-width="2"/>
<circle cx="144" cy="406" r="9" fill="#059669"/>
<circle cx="170" cy="406" r="9" fill="#d97706"/>
<text x="196" y="411" font-size="12" fill="#64748b">5 个主题色 token</text>

<rect x="392" y="88" width="476" height="340" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="412" y="116" font-size="13" font-weight="700" fill="#475569">画布预览</text>
<rect x="412" y="132" width="436" height="276" rx="8" fill="#f1f5f9"/>

<rect x="432" y="152" width="396" height="236" rx="10" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="432" y="152" width="122" height="24" rx="5" fill="#ede9fe"/>
<text x="444" y="169" font-size="12" font-weight="700" fill="#6d28d9">外框标题</text>

<rect x="452" y="196" width="356" height="172" rx="10" fill="none" stroke="#0ea5a4" stroke-width="2" stroke-dasharray="7 5"/>
<rect x="452" y="196" width="112" height="24" rx="5" fill="#ccfbf1"/>
<text x="464" y="213" font-size="12" font-weight="700" fill="#0f766e">分组框标题</text>

<rect x="474" y="238" width="150" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="488" y="266" font-size="15" font-weight="700" fill="#0f172a">需求梳理</text>
<rect x="474" y="292" width="150" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="488" y="320" font-size="15" font-weight="700" fill="#0f172a">方案评审</text>
<rect x="660" y="238" width="128" height="44" rx="8" fill="#ffffff" stroke="#94a3b8"/>
<text x="674" y="266" font-size="15" font-weight="700" fill="#0f172a">开发排期</text>

<text x="412" y="410" font-size="11.5" fill="#64748b">整段文字一起变：字号 / 字重 / 字形 / 字色，作用到对象整体</text>

<rect x="32" y="444" width="836" height="40" rx="8" fill="#ecfdf5" stroke="#6ee7b7"/>
<text x="52" y="469" font-size="13" fill="#047857">满足：统一调整（全局 / 按类型 / 单对象）　　不满足：10 个字里只改 3 个字　　改动面：约 25–30 处函数，4 路图形导出</text>
</g>
</svg>
